
<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MangaVerse | Manga World</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
 background:#090b14;color:white;
 font-family:Arial,sans-serif;
}
header{
 padding:22px 7%;display:flex;
 justify-content:space-between;align-items:center;
 background:#111522;position:sticky;top:0;
}
.logo{font-size:27px;font-weight:bold;color:#ff405d}
.logo span{color:white}
nav a{color:white;text-decoration:none;margin-left:20px}
.hero{
 padding:75px 8%;min-height:330px;
 background:linear-gradient(90deg,#111522,#28152d);
}
.hero h1{font-size:45px;margin-bottom:15px}
.hero p{color:#bbb;margin-bottom:25px}
button{
 background:#ff405d;color:white;border:0;
 padding:12px 22px;border-radius:8px;
 cursor:pointer;font-weight:bold;
}
.search{padding:25px 7%}
input{
 width:100%;padding:15px;border-radius:8px;
 border:1px solid #333;background:#171c2a;
 color:white;font-size:16px;
}
section{padding:15px 7% 40px}
h2{margin-bottom:22px}
.genres button{margin:0 7px 10px 0}
.grid{
 display:grid;grid-template-columns:
 repeat(auto-fit,minmax(160px,1fr));gap:20px;
}
.card{
 background:#151a28;border-radius:12px;
 overflow:hidden;transition:.3s;
}
.card:hover{transform:translateY(-7px)}
.card img{width:100%;height:230px;object-fit:cover}
.info{padding:13px}
.info h3{font-size:17px;margin-bottom:8px}
.info p{font-size:13px;color:#aaa;margin-bottom:10px}
.fav{background:#292f40;padding:8px 12px}
footer{text-align:center;padding:30px;color:#888}
</style>
</head>
<body>

<header>
 <div class="logo">Manga<span>Verse.</span></div>
 <nav>
  <a href="#">Bosh sahifa</a>
  <a href="#manga">Manga</a>
  <a href="#genres">Janrlar</a>
 </nav>
</header>

<div class="hero">
 <h1>Manga olamiga xush kelibsiz!</h1>
 <p>Eng yaxshi mangalarni bir joyda kashf eting.</p>
 <a href="#manga"><button>Manga ko'rish →</button></a>
</div>

<div class="search">
 <input id="search" placeholder="🔎 Manga qidirish..." oninput="render()">
</div>

<section id="genres">
 <h2>Janrlar</h2>
 <div class="genres">
  <button onclick="filter('all')">Barchasi</button>
  <button onclick="filter('Action')">Action</button>
  <button onclick="filter('Fantasy')">Fantasy</button>
  <button onclick="filter('Romance')">Romance</button>
  <button onclick="filter('Adventure')">Adventure</button>
 </div>
</section>

<section id="manga">
 <h2>🔥 Mashhur mangalar</h2>
 <div class="grid" id="grid"></div>
</section>

<footer>© 2026 MangaVerse | Created with ❤️</footer>

<script>
const mangas=[
 {name:"Solo Leveling",genre:"Action",rating:"9.8",
 img:"https://placehold.co/400x550/25204b/fff?text=Solo+Leveling"},
 {name:"One Piece",genre:"Adventure",rating:"9.9",
 img:"https://placehold.co/400x550/274b65/fff?text=One+Piece"},
 {name:"Naruto",genre:"Action",rating:"9.5",
 img:"https://placehold.co/400x550/9b5729/fff?text=Naruto"},
 {name:"Attack on Titan",genre:"Action",rating:"9.7",
 img:"https://placehold.co/400x550/46433b/fff?text=Attack+on+Titan"},
 {name:"Demon Slayer",genre:"Fantasy",rating:"9.6",
 img:"https://placehold.co/400x550/5a2838/fff?text=Demon+Slayer"},
 {name:"Your Name",genre:"Romance",rating:"9.4",
 img:"https://placehold.co/400x550/42617b/fff?text=Your+Name"}
];

let selected="all";
let favorites=[];

function filter(genre){
 selected=genre;
 render();
}

function render(){
 const query=document.getElementById("search").value.toLowerCase();
 const grid=document.getElementById("grid");
 grid.innerHTML="";

 const result=mangas.filter(m=>
  m.name.toLowerCase().includes(query) &&
  (selected==="all"||m.genre===selected)
 );

 result.forEach(m=>{
  const card=document.createElement("div");
  card.className="card";
  const img=document.createElement("img");
  img.src=m.img;
  img.alt=m.name;
  const info=document.createElement("div");
  info.className="info";
  const title=document.createElement("h3");
  title.textContent=m.name;
  const desc=document.createElement("p");
  desc.textContent=m.genre+" • ⭐ "+m.rating;
  const btn=document.createElement("button");
  btn.className="fav";
  btn.textContent=favorites.includes(m.name)?"❤️ Sevimli":"🤍 Sevimliga";
  btn.onclick=()=>{
   favorites=favorites.includes(m.name)
    ?favorites.filter(x=>x!==m.name)
    :[...favorites,m.name];
   render();
  };
  info.append(title,desc,btn);
  card.append(img,info);
  grid.append(card);
 });
 if(!result.length)grid.textContent="Manga topilmadi!";
}

render();
</script>
</body>
</html>
