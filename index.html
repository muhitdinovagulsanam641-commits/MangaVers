
<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MangaVerse</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  background: #090b14;
  color: white;
  font-family: Arial, sans-serif;
}

header {
  background: #111522;
  padding: 18px 4%;
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 15px;
  position: sticky;
  top: 0;
  z-index: 10;
}

.logo {
  font-size: 27px;
  font-weight: bold;
  color: #ff4165;
}

nav {
  display: flex;
  align-items: center;
  gap: 20px;
  flex-wrap: wrap;
}

nav a {
  color: white;
  text-decoration: none;
  font-size: 15px;
}

nav a:hover {
  color: #ff4165;
}

button {
  border: none;
  cursor: pointer;
  border-radius: 9px;
  padding: 11px 17px;
  font-weight: bold;
  color: white;
  background: #ff4165;
  transition: .2s;
}

button:hover {
  background: #e52e54;
  transform: translateY(-2px);
}

.language {
  background: #292f40;
  border: 1px solid #454c60;
}

.hero {
  padding: 85px 5%;
  background: linear-gradient(120deg,#25162f,#151d36);
}

.hero h1 {
  font-size: 42px;
  margin-bottom: 15px;
}

.hero p {
  color: #c4c7d4;
  font-size: 17px;
  margin-bottom: 25px;
}

main {
  padding: 30px 4%;
}

.search {
  width: 100%;
  padding: 17px;
  border-radius: 10px;
  background: #171d2b;
  color: white;
  border: 1px solid #353d50;
  font-size: 16px;
  outline: none;
  margin-bottom: 30px;
}

.search:focus {
  border-color: #ff4165;
}

h2 {
  margin: 25px 0 20px;
  font-size: 23px;
}

.filters {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
}

.filters button {
  background: #252d40;
}

.filters button.active {
  background: #ff4165;
}

.manga-list {
  display: grid;
  grid-template-columns: repeat(auto-fit,minmax(175px,1fr));
  gap: 20px;
}

.card {
  background: #171d2b;
  border-radius: 12px;
  overflow: hidden;
  position: relative;
  cursor: pointer;
  transition: .25s;
}

.card:hover {
  transform: translateY(-6px);
}

.cover {
  height: 250px;
  display: flex;
  justify-content: center;
  align-items: center;
  text-align: center;
  padding: 18px;
  font-size: 26px;
  font-weight: bold;
  background: linear-gradient(145deg,#38245f,#171d2b);
}

.card:nth-child(6n+2) .cover {
  background: linear-gradient(145deg,#225b77,#101d32);
}

.card:nth-child(6n+3) .cover {
  background: linear-gradient(145deg,#a55324,#34202b);
}

.card:nth-child(6n+4) .cover {
  background: linear-gradient(145deg,#514c40,#151522);
}

.card:nth-child(6n+5) .cover {
  background: linear-gradient(145deg,#793449,#20152c);
}

.card:nth-child(6n+6) .cover {
  background: linear-gradient(145deg,#456b8b,#151d35);
}

.card-info {
  padding: 15px;
}

.card-info p {
  color: #aab2c5;
  font-size: 13px;
  margin-top: 8px;
}

.favorite {
  position: absolute;
  top: 10px;
  right: 10px;
  background: #101522;
  border-radius: 50%;
  width: 39px;
  height: 39px;
  font-size: 20px;
  padding: 0;
}

.favorite:hover {
  background: #30384c;
}

.empty {
  color: #aab2c5;
  padding: 15px 0;
}

.modal {
  display: none;
  position: fixed;
  inset: 0;
  background: #000c;
  z-index: 30;
  justify-content: center;
  align-items: center;
  padding: 20px;
}

.modal-content {
  background: #171d2b;
  border: 1px solid #353d50;
  padding: 30px;
  border-radius: 15px;
  max-width: 460px;
  width: 100%;
}

.modal-content h2 {
  color: #ff4165;
  margin-top: 0;
}

.modal-content p {
  color: #c5cbd8;
  line-height: 1.7;
  margin: 15px 0;
}

.close-button {
  margin-top: 10px;
}

footer {
  text-align: center;
  padding: 35px;
  color: #9299a9;
  background: #111522;
  margin-top: 40px;
}

@media(max-width:600px) {
  header {
    justify-content: center;
  }

  nav {
    justify-content: center;
    gap: 13px;
  }

  .hero {
    padding: 60px 5%;
  }

  .hero h1 {
    font-size: 29px;
  }

  .manga-list {
    grid-template-columns: repeat(2,minmax(0,1fr));
    gap: 12px;
  }

  .cover {
    height: 190px;
    font-size: 20px;
  }
}
</style>
</head>

<body>

<header>
  <div class="logo">MangaVerse.</div>

  <nav>
    <a href="#home" data-i18n="home">Bosh sahifa</a>
    <a href="#manga" data-i18n="manga">Manga</a>
    <a href="#genres" data-i18n="genres">Janrlar</a>
    <a href="#favorites" data-i18n="favorites">Sevimlilar</a>
    <button class="language" id="languageBtn">EN</button>
  </nav>
</header>

<section class="hero" id="home">
  <h1 data-i18n="welcome">Manga olamiga xush kelibsiz!</h1>
  <p data-i18n="subtitle">
    Eng yaxshi mangalarni bir joyda kashf eting.
  </p>
  <button onclick="document.getElementById('manga').scrollIntoView()"
  data-i18n="explore">Manga ko‘rish →</button>
</section>

<main>

<input
  class="search"
  id="search"
  placeholder="🔎 Manga qidirish..."
>

<h2 id="genres" data-i18n="genres">Janrlar</h2>

<div class="filters" id="filters">
  <button class="active" data-genre="all">Barchasi</button>
  <button data-genre="Action">Action</button>
  <button data-genre="Fantasy">Fantasy</button>
  <button data-genre="Romance">Romance</button>
  <button data-genre="Adventure">Adventure</button>
</div>

<h2 id="manga" data-i18n="popular">🔥 Mashhur mangalar</h2>
<div class="manga-list" id="mangaList"></div>

<h2 id="favorites" data-i18n="favoritesTitle">
  ❤️ Sevimli mangalar
</h2>
<div class="manga-list" id="favoriteList"></div>

</main>

<div class="modal" id="modal">
  <div class="modal-content">
    <h2 id="modalTitle"></h2>
    <p id="modalDescription"></p>
    <p id="modalGenre"></p>
    <p id="modalStatus"></p>
    <button class="close-button" id="closeModal"
    data-i18n="close">Yopish</button>
  </div>
</div>

<footer>
  © 2026 MangaVerse. All rights reserved.
</footer>

<script>
const mangas = [
  {
    id: 1,
    name: "Solo Leveling",
    genre: "Action",
    status: "Tugallangan",
    statusEn: "Completed",
    description: "Oddiy ovchi Sung Jin-Woo kuchli jangchiga aylanish yo‘lida ko‘plab sinovlardan o‘tadi.",
    descriptionEn: "Hunter Sung Jin-Woo faces many challenges on his journey to becoming a powerful hunter."
  },
  {
    id: 2,
    name: "One Piece",
    genre: "Adventure",
    status: "Davom etmoqda",
    statusEn: "Ongoing",
    description: "Luffy va uning do‘stlari buyuk xazinani izlab dengizlar bo‘ylab sayohat qiladi.",
    descriptionEn: "Luffy and his friends travel across the seas in search of a legendary treasure."
  },
  {
    id: 3,
    name: "Naruto",
    genre: "Action",
    status: "Tugallangan",
    statusEn: "Completed",
    description: "Naruto ismli yosh ninja o‘z orzusi sari intilib, do‘stlik va jasoratni o‘rganadi.",
    descriptionEn: "A young ninja named Naruto follows his dream and learns about friendship and courage."
  },
  {
    id: 4,
    name: "Attack on Titan",
    genre: "Action",
    status: "Tugallangan",
    statusEn: "Completed",
    description: "Insoniyat sirli devorlar ortida yashaydigan hayajonli sarguzasht.",
    descriptionEn: "An exciting story about humanity living behind mysterious walls."
  },
  {
    id: 5,
    name: "Demon Slayer",
    genre: "Fantasy",
    status: "Tugallangan",
    statusEn: "Completed",
    description: "Tanjiro oilasini himoya qilish va singlisiga yordam berish uchun safarga chiqadi.",
    descriptionEn: "Tanjiro begins a journey to protect his family and help his sister."
  },
  {
    id: 6,
    name: "Your Name",
    genre: "Romance",
    status: "Tugallangan",
    statusEn: "Completed",
    description: "Taqdir orqali bir-biriga bog‘langan ikki yoshning sirli hikoyasi.",
    descriptionEn: "A mysterious story about two young people connected by fate."
  }
];

const translations = {
  uz: {
    home: "Bosh sahifa",
    manga: "Manga",
    genres: "Janrlar",
    favorites: "Sevimlilar",
    welcome: "Manga olamiga xush kelibsiz!",
    subtitle: "Eng yaxshi mangalarni bir joyda kashf eting.",
    explore: "Manga ko‘rish →",
    search: "🔎 Manga qidirish...",
    popular: "🔥 Mashhur mangalar",
    favoritesTitle: "❤️ Sevimli mangalar",
    all: "Barchasi",
    action: "Jangari",
    fantasy: "Fantastika",
    romance: "Romantika",
    adventure: "Sarguzasht",
    close: "Yopish",
    genre: "Janr",
    status: "Holati",
    noResults: "Manga topilmadi.",
    noFavorites: "Hozircha sevimli mangalar yo‘q."
  },
  en: {
    home: "Home",
    manga: "Manga",
    genres: "Genres",
    favorites: "Favorites",
    welcome: "Welcome to the world of Manga!",
    subtitle: "Discover the best manga in one place.",
    explore: "Explore Manga →",
    search: "🔎 Search manga...",
    popular: "🔥 Popular Manga",
    favoritesTitle: "❤️ Favorite Manga",
    all: "All",
    action: "Action",
    fantasy: "Fantasy",
    romance: "Romance",
    adventure: "Adventure",
    close: "Close",
    genre: "Genre",
    status: "Status",
    noResults: "No manga found.",
    noFavorites: "No favorite manga yet."
  }
};

let language = localStorage.getItem("mangaLanguage") || "uz";
let selectedGenre = "all";
let favorites = JSON.parse(localStorage.getItem("mangaFavorites") || "[]");

function t(key) {
  return translations[language][key];
}

function genreName(genre) {
  const names = {
    all: "all",
    Action: "action",
    Fantasy: "fantasy",
    Romance: "romance",
    Adventure: "adventure"
  };
  return t(names[genre]);
}

function applyLanguage() {
  document.documentElement.lang = language;

  document.querySelectorAll("[data-i18n]").forEach(element => {
    const key = element.dataset.i18n;
    element.textContent = t(key);
  });

  document.getElementById("search").placeholder = t("search");

  document.getElementById("languageBtn").textContent =
    language === "uz" ? "EN" : "UZ";

  document.querySelectorAll(".filters button").forEach(button => {
    button.textContent = genreName(button.dataset.genre);
    button.classList.toggle(
      "active",
      button.dataset.genre === selectedGenre
    );
  });

  renderManga();
}

function createCard(manga) {
  const card = document.createElement("div");
  card.className = "card";

  const cover = document.createElement("div");
  cover.className = "cover";
  cover.textContent = manga.name;

  const favorite = document.createElement("button");
  favorite.className = "favorite";
  favorite.textContent = favorites.includes(manga.id) ? "❤️" : "♡";
  favorite.setAttribute("aria-label", "Favorite");

  favorite.addEventListener("click", event => {
    event.stopPropagation();
    toggleFavorite(manga.id);
  });

  const info = document.createElement("div");
  info.className = "card-info";

  const title = document.createElement("h3");
  title.textContent = manga.name;

  const genre = document.createElement("p");
  genre.textContent = genreName(manga.genre);

  info.append(title, genre);
  card.append(cover, favorite, info);

  card.addEventListener("click", () => showDetails(manga));

  return card;
}

function renderManga() {
  const query = document.getElementById("search").value
    .trim().toLowerCase();

  const filtered = mangas.filter(manga => {
    const matchesName = manga.name.toLowerCase().includes(query);
    const matchesGenre =
      selectedGenre === "all" || manga.genre === selectedGenre;

    return matchesName && matchesGenre;
  });

  const mangaList = document.getElementById("mangaList");
  mangaList.replaceChildren();

  filtered.forEach(manga => {
    mangaList.appendChild(createCard(manga));
  });

  if (filtered.length === 0) {
    const empty = document.createElement("p");
    empty.className = "empty";
    empty.textContent = t("noResults");
    mangaList.appendChild(empty);
  }

  const favoriteList = document.getElementById("favoriteList");
  favoriteList.replaceChildren();

  const saved = mangas.filter(manga =>
    favorites.includes(manga.id)
  );

  saved.forEach(manga => {
    favoriteList.appendChild(createCard(manga));
  });

  if (saved.length === 0) {
    const empty = document.createElement("p");
    empty.className = "empty";
    empty.textContent = t("noFavorites");
    favoriteList.appendChild(empty);
  }
}

function toggleFavorite(id) {
  if (favorites.includes(id)) {
    favorites = favorites.filter(item => item !== id);
  } else {
    favorites.push(id);
  }

  localStorage.setItem("mangaFavorites", JSON.stringify(favorites));
  renderManga();
}

function showDetails(manga) {
  document.getElementById("modalTitle").textContent = manga.name;

  document.getElementById("modalDescription").textContent =
    language === "uz" ? manga.description : manga.descriptionEn;

  document.getElementById("modalGenre").textContent =
    t("genre") + ": " + genreName(manga.genre);

  document.getElementById("modalStatus").textContent =
    t("status") + ": " +
    (language === "uz" ? manga.status : manga.statusEn);

  document.getElementById("modal").style.display = "flex";
}

document.getElementById("languageBtn").addEventListener("click", () => {
  language = language === "uz" ? "en" : "uz";
  localStorage.setItem("mangaLanguage", language);
  applyLanguage();
});

document.getElementById("search").addEventListener("input", renderManga);

document.getElementById("filters").addEventListener("click", event => {
  const button = event.target.closest("button[data-genre]");
  if (!button) return;

  selectedGenre = button.dataset.genre;
  applyLanguage();
});

document.getElementById("closeModal").addEventListener("click", () => {
  document.getElementById("modal").style.display = "none";
});

document.getElementById("modal").addEventListener("click", event => {
  if (event.target.id === "modal") {
    event.currentTarget.style.display = "none";
  }
});

applyLanguage();
</script>

</body>
</html>
